<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RJ MPBS AI - Custom Agent Platform</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: var(--card); padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .controls { display: flex; gap: 10px; align-items: center; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        
        .agent-panel { width: 350px; background: #111827; border-right: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .avatar-box { width: 160px; height: 160px; border-radius: 50%; border: 3px solid var(--accent); overflow: hidden; margin-bottom: 15px; background: #334155; display: flex; align-items: center; justify-content: center; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .chat-panel { flex: 1; display: flex; flex-direction: column; }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 15px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }
        .user-msg { background: var(--primary); align-self: flex-end; }
        .ai-msg { background: var(--card); align-self: flex-start; border: 1px solid #334155; }
        .input-box { display: flex; padding: 15px; background: var(--card); border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #475569; background: #0f172a; color: white; }
        button { background: var(--primary); color: white; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 5px; cursor: pointer; }
        
        #setupModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--card); padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; border: 1px solid #334155; text-align: center; }
        .modal-box input, .modal-box select { width: 90%; margin-bottom: 15px; padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 5px; }
    </style>
</head>
<body>

    <div id="setupModal">
        <div class="modal-box">
            <h2 style="color: var(--accent);">আপনার এআই এজেন্ট তৈরি করুন</h2>
            <p style="font-size: 0.9rem;">কাস্টমার তার পছন্দমতো ছবি ও নাম সেট করতে পারবেন</p>
            <input type="text" id="customAgentName" placeholder="এজেন্টের নাম (যেমন: লিসা)">
            <label style="display:block; text-align:left; font-size:0.8rem; margin-bottom:5px;">এজেন্টের ছবি আপলোড করুন:</label>
            <input type="file" id="agentImageInput" accept="image/*" style="background:none; border:none;">
            <br>
            <button onclick="saveAgentSettings()">এজেন্ট চালু করুন</button>
        </div>
    </div>

    <header>
        <h1 id="headerTitle">RJ MPBS AI</h1>
        <div class="controls">
            <span id="activeAgentName" style="color: var(--accent); font-weight: bold;"></span>
            <button onclick="document.getElementById('setupModal').style.display='flex'" style="background: #334155; font-size: 0.8rem;">এজেন্ট পরিবর্তন</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="agent-panel">
            <div class="avatar-box" id="avatarDisplay">
                <span style="font-size: 3rem;">🤖</span>
            </div>
            <h3 id="agentNameTag" style="margin: 5px 0;">AI Agent</h3>
            <p id="agentStatus" style="font-size: 0.85rem; color: #94a3b8;">কথা বলার জন্য প্রস্তুত...</p>
        </div>

        <div class="chat-panel">
            <div class="chat-container" id="chatContainer">
                <div class="message ai-msg">হ্যালো! আমি আপনার কাস্টম এআই এজেন্ট। আমাকে যেকোনো প্রশ্ন করুন।</div>
            </div>

            <div class="input-box">
                <input type="text" id="userInput" placeholder="আপনার বার্তা এখানে লিখুন..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button onclick="sendMessage()">পাঠান</button>
            </div>
        </div>
    </div>

    <script>
        let agentName = "AI Agent";
        let agentAvatarUrl = "";

        function saveAgentSettings() {
            const nameInput = document.getElementById('customAgentName').value.trim();
            const fileInput = document.getElementById('agentImageInput');
            
            if (nameInput) {
                agentName = nameInput;
                document.getElementById('agentNameTag').innerText = agentName;
                document.getElementById('headerTitle').innerText = `RJ MPBS AI - ${agentName}`;
                document.getElementById('activeAgentName').innerText = `Agent: ${agentName}`;
            }

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    agentAvatarUrl = e.target.result;
                    document.getElementById('avatarDisplay').innerHTML = `<img src="${agentAvatarUrl}" alt="Agent Avatar">`;
                }
                reader.readAsDataURL(fileInput.files[0]);
            }

            document.getElementById('setupModal').style.display = 'none';
        }

        function appendMsg(sender, text) {
            const c = document.getElementById('chatContainer');
            const d = document.createElement('div');
            d.className = `message ${sender === 'User' ? 'user-msg' : 'ai-msg'}`;
            d.innerHTML = text.replace(/\n/g, '<br>');
            c.appendChild(d);
            c.scrollTop = c.scrollHeight;
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'bn-BD';
                document.getElementById('agentStatus').innerText = "কথা বলছে...";
                utterance.onend = () => {
                    document.getElementById('agentStatus').innerText = "অপেক্ষা করছে...";
                };
                window.speechSynthesis.speak(utterance);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const msg = input.value.trim();
            if (!msg) return;

            appendMsg('User', msg);
            input.value = '';

            const loadId = 'load_' + Date.now();
            appendMsg('AI', `<span id="${loadId}">⏳ ${agentName} ভাবছে...</span>`);
            document.getElementById('agentStatus').innerText = "চিন্তা করছে...";

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: msg, 
                        model: 'gemini',
                        apiKey: "AQ.Ab8RN6I8_TJrDoXFqz85ByE-nkdGXOVEfxwLC9S250uVZxUeuQ" 
                    })
                });
                const data = await res.json();
                const reply = data.reply || data.error;
                
                document.getElementById(loadId).parentElement.innerHTML = reply;
                speakText(reply);

            } catch (err) {
                document.getElementById(loadId).parentElement.innerHTML = "❌ সার্ভার কানেকশনে সমস্যা হয়েছে।";
                document.getElementById('agentStatus').innerText = "ত্রুটি ঘটেছে";
            }
        }
    </script>
</body>
</html>
